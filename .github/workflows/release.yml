# Builds "Puck Bridge.app" and attaches PuckBridge.zip to the GitHub release.
#
# Runs when:
#   - a release is published (GitHub → Releases → Draft a new release → new tag vX.Y.Z → Publish)
#   - a v* tag is pushed (creates the release if it doesn't exist yet)
#   - manually: Actions → Release → Run workflow → enter a tag. An existing tag is rebuilt (the zip is replaced);
#     a new one is created on the commit the run was started from (pick the branch, normally main).
#
# Signing: if repo secrets SIGNING_CERT_P12 (base64 .p12) and SIGNING_CERT_PASSWORD exist, the app is
# signed with "Puck Bridge Signing" so macOS keeps permissions across updates. Otherwise ad-hoc.
# Make them once with scripts/make-signing-cert.sh (on a Mac).
name: Release

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.4.0 (a new tag is created on the chosen branch)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The puck firmware the app bundles (Settings → Puck → Firmware). Built on Linux: it needs Docker.
  firmware:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Check tag
        id: tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Tag $TAG doesn't exist yet: it will be created on $GITHUB_SHA ($GITHUB_REF_NAME)."
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag $TAG not found"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}
      - name: Build the puck firmware
        run: if [ -f scripts/build-firmware.sh ]; then bash scripts/build-firmware.sh; else mkdir -p firmware/out; fi
      - uses: actions/upload-artifact@v4
        with:
          name: puck-firmware
          path: firmware/out
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: firmware
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.firmware.outputs.ref }}
      - uses: actions/download-artifact@v4
        continue-on-error: true   # a tag without firmware patches builds no firmware
        with:
          name: puck-firmware
          path: firmware/out

      - name: Import signing certificate (optional)
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        # Older tags don't have the script; they build ad-hoc.
        run: |
          if [ -f scripts/ci-import-cert.sh ]; then
            bash scripts/ci-import-cert.sh
          else
            echo "::warning::This tag predates scripts/ci-import-cert.sh, so it is ad-hoc signed."
          fi

      - name: Build
        run: bash scripts/build.sh "$TAG"   # bash: older tags have the script without its executable bit

      - name: Verify signature
        run: |
          codesign --verify --deep --strict "build/Puck Bridge.app"
          if [ -n "${SIGN_IDENTITY:-}" ] && ! codesign -dvv "build/Puck Bridge.app" 2>&1 | grep -q "Authority=$SIGN_IDENTITY"; then
            echo "::warning::Signing with '$SIGN_IDENTITY' failed; this build is ad-hoc signed. Check the SIGNING_CERT_* secrets."
          fi

      - name: Attach PuckBridge.zip to the release
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Notes: this version's section of CHANGELOG.md (shown in the app's update dialog), else GitHub's own.
            awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
            if [ -s "$RUNNER_TEMP/notes.md" ]; then NOTES=(--notes-file "$RUNNER_TEMP/notes.md"); else NOTES=(--generate-notes); fi
            # --target only matters for a new tag (created on the commit that was built).
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" "${NOTES[@]}" --target "$(git rev-parse HEAD)"
          fi
          gh release upload "$TAG" dist/PuckBridge.zip --repo "$GITHUB_REPOSITORY" --clobber
